name: Build Kristine

on:
  push:
    branches:
      - main
  pull_request:
  # The release workflow builds the main it just merged
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-app:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # The fingerprint library is Rust; release APKs carry it for these three ABIs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      # Every APK is signed with the same key, so a new one installs as an update over the one before
      - name: Restore the signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::The ANDROID_DEBUG_KEYSTORE secret is missing: the APK would get a new key and not install as an update"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Run gradle assemble task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assemble --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apk distribution
          path: ./androidApp/build/outputs/apk/debug/*
  build-linux-app:
    name: Build Linux app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # The fingerprint library is Rust, built for this machine
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run gradle package task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew 
          ./gradlew packageDistributionForCurrentOS --no-daemon

      # Compose's AppImage format is only the app folder; appimagetool packs it into one file
      - name: Pack AppImage
        run: |
          APPDIR=desktopApp/build/compose/binaries/main/app/Kristine
          cp shared/src/commonMain/composeResources/drawable/icon.png $APPDIR/kristine.png
          ln -s bin/Kristine $APPDIR/AppRun
          printf '[Desktop Entry]\nType=Application\nName=Kristine\nExec=Kristine\nIcon=kristine\nCategories=AudioVideo;Audio;Player;\n' > $APPDIR/kristine.desktop
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run $APPDIR Kristine-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage distribution
          path: ./Kristine-x86_64.AppImage

      # Only from main (a push or a release), so pull requests can't publish an image
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/drulysses/kristine:latest .
          docker push ghcr.io/drulysses/kristine:latest
  build-windows-app:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@v3

      # The fingerprint library is Rust, built for this machine
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Gradle Build
        uses: gradle/gradle-build-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          arguments: packageDistributionForCurrentOS --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exe distribution
          path: ./desktopApp/build/compose/binaries/main/exe/*
