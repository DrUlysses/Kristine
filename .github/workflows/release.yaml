name: Release Kristine

# Actions → Release Kristine → Run workflow: raises the version on dev and merges dev into main, whose push builds and deploys
# Needs the secret RELEASE_TOKEN: a token of an admin (Contents read/write), since main only takes pull requests and
# admins may push past that; pushes made with it also start the build and deploy workflows, the built-in token's don't
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'What changed'
        type: choice
        required: true
        default: Bugfix
        options:
          - Bugfix
          - Minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Raise version and merge dev into main
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is missing: main only takes pull requests, the built-in token can't push to it"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Raise the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          file=gradle/libs.versions.toml
          current=$(sed -n 's/^kristine = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' "$file")
          if [ -z "$current" ]; then
            echo "::error::No 'kristine = \"x.y.z\"' line in $file"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          if [ "$BUMP" = Minor ]; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          sed -i "s/^kristine = \"$current\"$/kristine = \"$next\"/" "$file"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "$current → $next"

      - name: Commit to dev and merge into main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $VERSION"
          git push origin dev
          git checkout main
          git merge --no-ff dev -m "Merge branch 'dev'"
          git push origin main

